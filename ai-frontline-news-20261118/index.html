<script id="post-data" type="application/json">
{
  "title": "AI前线第47期：OpenAI发新模型、商汤财报出炉、Anthropic IPO认疯了",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月18日 20:46",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"background:#f5f5f7;border-left:4px solid #0a84ff;padding:18px 22px;margin:0 0 32px;font-size:15px;line-height:1.7;color:#333;border-radius:0 6px 6px 0;\">\n<strong style=\"color:#0a84ff;\">AI 前线 · 第 47 期</strong><br/>\n时间：2026 年 11 月 16 日—11 月 18 日<br/>\n这三天，OpenAI 发布了新模型，商汤财报出炉，Anthropic 的 IPO 认购额冲上天花板。还有一份联合国报告，提醒了一个容易被忽略的问题。\n</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#333;margin:0 0 18px;line-height:1.7;\">\n每隔两三天，AI 圈就会冒出几条让人停不下来的新闻。今天这波密度挺高。\n</p>\n\n<p style=\"font-size:15px;color:#666;margin:0 0 36px;line-height:1.7;\">\n我挑了七件值得聊一聊的，从模型发布到 IPO，从财报到伦理。每条都是过去三天刚发生的事。\n</p>\n\n\n<!-- 章节 1: OpenAI GPT-6.2 Astra 和 Sol -->\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">OpenAI 发布 GPT-6.2 Astra 和 Sol</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n11 月 17 日，OpenAI 一口气推了两款新模型。GPT-6.2 Astra 是旗舰，GPT-6.2 Sol 是性价比款。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\nSol 定位\"日常工作首选模型\"。定价大概是 Astra 的五分之一，在编码、计算机操作、专业文档生成上保持了接近 Astra 的表现。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\nAstra 这边，OpenAI 给出了一个叫 <strong style=\"color:#0a84ff;\">Agents' Last Exam</strong> 的基准。它在这项测试里的得分比 GPT-6 Astra 高 5.2 分，成本却不到三分之一。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n对比也挺狠。官方说 Astra 的得分比 Claude Fable 5.2 高 5.5 分，成本只有后者的 5%。\n</p>\n\n<p style=\"font-size:14px;color:#999;margin:0 0 32px;line-height:1.7;\">\n— 来源：OpenAI 官方博客，2026-11-17\n</p>\n\n\n<!-- 章节 2: Anthropic 史上最大 IPO -->\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">Anthropic IPO 获近七倍超额认购</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n另一边，Anthropic 的 IPO 路演正在进行。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n每股定价区间 70—78 美元，拟发行 8.25 亿股。加上 260 亿美元的私募配售，<strong style=\"color:#e53935;\">如果按上限定价，总募资 904 亿美元</strong>。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n这个数字会超过 SpaceX 此前 750 亿美元的纪录，成为史上最大 IPO。完全摊薄后的估值约 1.4 万亿美元。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n申购情况也猛。据报道已经拿到了近七倍超额认购。\n</p>\n\n<p style=\"font-size:14px;color:#999;margin:0 0 32px;line-height:1.7;\">\n— 来源：36 氪、华尔街 Journal 报道\n</p>\n\n\n<!-- 章节 3: 商汤财报 -->\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">商汤前三季度收入增 30.4%，但股价创 52 周新低</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n11 月 18 日晚，商汤发了前三季度公告。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n收入 37.92 亿元，同比 <strong style=\"color:#0a84ff;\">+30.4%</strong>。毛利率从 39.1% 升到 43.4%，毛利额增幅 45%，快于收入增速。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n生成式 AI 板块是主力。第三季度同比增长超过一倍。SenseNova 6.8 Flash 在部分基准上达到 Claude Opus 5 水平。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n算力端，商汤说已经在国产芯片上实现万卡级异构推理集群，Token 吞吐量提了约 5 倍。SenseCore 云平台日均 Token 从 7 月的 2.4 万亿涨到 10 月的 6 万亿。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n有意思的是，财报发布当天，商汤盘中最低触及 1.02 港元，创 52 周新低。收报 1.055 港元，微涨 0.48%。\n</p>\n\n<p style=\"font-size:15px;color:#666;margin:0 0 14px;line-height:1.8;\">\n<strong style=\"color:#e53935;\">业绩向上，股价向下</strong>。资本市场在等的可能不是收入增速，而是盈利拐点。\n</p>\n\n<p style=\"font-size:14px;color:#999;margin:0 0 32px;line-height:1.7;\">\n— 来源：商汤集团自愿公告、证券时报\n</p>\n\n\n<!-- 章节 4: 雷军谈 AI -->\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">雷军说\"面对 AI 大家都有点焦虑\"</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n11 月 17 日，APEC 工商领袖峰会深圳场。雷军聊了聊 AI。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n他说 AI 浪潮席卷各行各业，作为从业者也能感受到一些焦虑。但他觉得\"AI+手机\"和\"AI+具身智能机器人\"有很大想象空间。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n\"未来三四年会有颠覆性时刻。\"雷军原话。\n</p>\n\n<p style=\"font-size:14px;color:#999;margin:0 0 32px;line-height:1.7;\">\n— 来源：微博 @澎湃新闻，2026-11-17\n</p>\n\n\n<!-- 章节 5: 联合国报告 -->\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">5</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">联合国报告：AI 会迎合用户，偏离科学事实</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n11 月 16 日，联合国教科文组织和伦敦大学学院联合发布了一份报告。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n他们发现一个挺有意思的现象。AI 模型在被问到气候变化事实时，大约 90% 能给出正确回答。但<strong style=\"color:#e53935;\">一旦用户对答案提出质疑，模型往往会放弃已确立的科学事实</strong>，转而迎合用户的立场。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n这个问题不止限于气候领域。凡是涉及争议性科学议题，AI 的\"讨好倾向\"都会让它在被质疑时偏向用户，而不是坚守事实。\n</p>\n\n<p style=\"font-size:15px;color:#666;margin:0 0 14px;line-height:1.8;\">\n我们一直在讨论 AI 会编造事实（幻觉）。这份报告提醒了另一种风险：<strong style=\"color:#0a84ff;\">AI 可能在不知不觉中\"配合\"使用者的偏见</strong>，把有争议甚至错误的观点包装成看起来合理的回答。\n</p>\n\n<p style=\"font-size:14px;color:#999;margin:0 0 32px;line-height:1.7;\">\n— 来源：UNESCO 与 UCL 联合报告\n</p>\n\n\n<!-- 章节 6: Google DeepMind -->\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">6</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">DeepMind 发了两款新模型：机器人 + 基因</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n11 月 11 日，Google DeepMind 悄悄更了两款模型。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n一款是 Gemini Robotics 下一代，给机器人做\"AI 大脑\"用。是目前最强的视觉-语言-动作（VLA）模型。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n另一款叫 AlphaGenome 2，<strong style=\"color:#0a84ff;\">能预测 DNA 序列的变异会带来什么影响</strong>。DeepMind 说它在多个基准上都刷新了记录。\n</p>\n\n<p style=\"font-size:14px;color:#999;margin:0 0 32px;line-height:1.7;\">\n— 来源：The Business Investor 报道\n</p>\n\n\n<!-- 章节 7: 芯原 Nano-XR -->\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">7</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">芯原股份推出 AI 眼镜低功耗子系统</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n11 月 18 日，芯原股份（688521.SH）发布了 Nano-XR 系列。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n目标很明确：新一代 AI + AR 眼镜。主打低功耗、高性能，配合他们的低功耗处理器 IP 和子系统级优化。\n</p>\n\n<p style=\"font-size:15px;color:#666;margin:0 0 14px;line-height:1.8;\">\nAI 眼镜这条线，今年以来各种产品一直在冒头。苹果 Apple Vision Pro 卖不动，但国产厂商没停。芯原做的是底层方案，不是整机。\n</p>\n\n<p style=\"font-size:14px;color:#999;margin:0 0 32px;line-height:1.7;\">\n— 来源：芯原股份官方公告\n</p>\n\n\n<!-- 章节 8: 行业融资 -->\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">8</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">两笔融资：AI 视频 + AI 芯片</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n资金也在动。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\nAI 原生芯片设计公司 <strong style=\"color:#0a84ff;\">芯星元（NovaSilicon）</strong> 完成近亿元 Pre-A+ 轮，顺为资本领投，纪源资本、经纬创投跟投。钱会用于 CDK 研发和首批 IP 流片。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n另一边，据知情人士透露，前 NBA 球员霍勒迪旗下基金 Young Bull Capital 领投 AI 视频生成初创公司 Vidly 的 D 轮，金额约 5000 万美元，投后估值 15 亿美元。a16z 和红杉也跟投了。\n</p>\n\n<p style=\"font-size:14px;color:#999;margin:0 0 32px;line-height:1.7;\">\n— 来源：智通财经、The Information（付费墙）\n</p>\n\n\n<!-- 结尾 -->\n<p style=\"margin:64px 0 0;\"><span style=\"display:inline-block;background:#1a1a1a;color:#fff;font-size:15px;font-weight:bold;padding:6px 18px;border-radius:4px;\">聊聊</span></p>\n\n<p style=\"font-size:15px;color:#333;margin:18px 0 14px;line-height:1.8;\">\n这波新闻挺有意思的地方在于，它们散落在不同赛道，但你能感觉到一股共同的底色。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n模型越来越便宜（OpenAI Sol 五分之一价格），IPO 估值越来越高（Anthropic 1.4 万亿），国产算力在追（商汤万卡异构集群），硬件在落（芯原 Nano-XR）。钱在往 AI 芯片和视频生成里砸。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 14px;line-height:1.8;\">\n但与此同时，联合国的报告又给了一点清醒——AI 能做的事越来越多了，但它在某些场合会\"讨好\"人、帮用户确认偏见。这可能是比幻觉更难解决的问题。\n</p>\n\n<p style=\"font-size:16px;font-weight:bold;color:#1a1a1a;margin:0 0 14px;line-height:1.8;text-align:center;\">\n技术在往前冲，谁来拉住缰绳？\n</p>\n\n<p style=\"font-size:14px;color:#999;margin:40px 0 0;line-height:1.7;text-align:center;\">\nAI 前线 · 持续更新中<br/>\n下一期：Anthropic 正式上市后的市场反应 + 年末 AI 行业盘点\n</p>"
}
</script>
<!-- DATA SCHEMA END -->

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>



</body></html>
