<script id="post-data" type="application/json">
{
  "title": "我让AI把Excel报表自动化了，花了40分钟",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月18日 21:57",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"background:#f5f5f7;border-left:4px solid #0a84ff;padding:18px 22px;margin:0 0 34px;font-size:15px;line-height:1.75;color:#333;border-radius:0 6px 6px 0;\">\n<strong style=\"color:#0a84ff;\">实测记录</strong><br/>\n做的事：把 3 个门店的日流水，做成一张月度报表<br/>\n原来：约 2 天　　现在：40 分钟<br/>\n代价：写提示词花了 12 分钟，返工 2 次\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n上个月月底，我对着三张 Excel 表坐了两天。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n不是不会做，是每一步都得手动来一遍。合并、清格式、汇总、算环比、标异常、画图。做完眼睛是花的。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n这个月我换了个做法，把中间最烦的那部分交给 AI。\n</p>\n\n<p style=\"font-size:19px;font-weight:bold;color:#1a1a1a;margin:0 0 34px;line-height:1.8;\">\n结果花了 40 分钟。\n</p>\n\n<p style=\"text-align:center;margin:0 0 8px;\">\n<img src=\"assets/flow.png\" style=\"max-width:100%;border-radius:8px;\" />\n</p>\n<p style=\"font-size:13px;color:#999;text-align:center;margin:0 0 34px;line-height:1.6;\">\n同一张报表，两种做法的流程对比\n</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">1</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">先说清楚这活到底烦在哪</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n三个门店，每个一份日流水。听起来简单，实际是这样的：\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\nA 店的日期是 <strong>2026/11/1</strong>，B 店是 <strong>2026-11-01</strong>，C 店干脆写成 <strong>11 月 1 日</strong>。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n金额栏有的带千分位，有的带\"元\"字，还有的混着\"约\"。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n六个步骤里，真正耗时的是第二步——清格式。\n</p>\n\n<p style=\"font-size:17px;font-weight:bold;color:#e53935;margin:0 0 34px;line-height:1.85;\">\n做表最耗时间的从来不是算数，是把脏数据洗干净。\n</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">2</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">我是怎么让 AI 接手的</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n第一步不是开 AI，是整理数据。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n我把三张表放进同一个文件，删掉客户姓名和电话，只留日期、门店、品类、金额、数量五列。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n这一步五分钟，但必须做。脱敏是底线，也是后面 AI 能放心处理的前提。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n然后把文件丢给 AI，说清楚要什么。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n它给了我两套方案：一是直接帮我算，二是写一段能重复跑的脚本。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n我选了脚本。因为下个月还要再做一次，能复用的才叫自动化。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n第一次跑，报错了。日期列三种格式混在一起，脚本把\"11 月 1 日\"当成了文本。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n我补了一句要求，让它先把日期统一成标准格式再往下走。第二次跑通。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n从打开文件到出图，40 分钟。其中 12 分钟花在写提示词和改提示词上。\n</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">3</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">踩到的三个坑</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n<strong>坑一，合并单元格必炸。</strong>\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n只要表里有合并单元格，读进来的数据就会错位。跑之前先全部拆开，把空白补齐。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n<strong>坑二，数字里混了符号就变成文本。</strong>\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n\"1,280\"和\"1280元\"在 AI 眼里不是数字。汇总时它们会被直接跳过，而且不报错——你只会得到一个偏小的总数。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n<strong>坑三，AI 会自作主张补数据。</strong>\n</p>\n\n<blockquote style=\"border-left:4px solid #e53935;background:#fdf3f3;padding:16px 20px;margin:0 0 18px;font-size:15px;line-height:1.85;color:#444;\">\n我第一版提示词没写清楚，有一天的流水是空的，AI 按前后两天均值给我补了一个数，还补得挺像。\n</blockquote>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n后来我在提示词里加了一句硬要求：<strong style=\"color:#e53935;\">缺失就标记为空，不要推测，不要补全。</strong>\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 34px;line-height:1.9;\">\n做报表最怕的不是缺数据，是假数据看起来像真的。\n</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#0a84ff;color:#fff;font-size:19px;font-weight:bold;padding:3px 15px;border-radius:8px;\">4</span></p>\n<p style=\"font-size:20px;font-weight:bold;color:#0a84ff;margin:14px 0 22px;border-bottom:3px solid #0a84ff;padding-bottom:9px;\">可以直接抄的提示词</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n我最后跑通的那版大概是这个结构，把方括号里的换成你自己的：\n</p>\n\n<p style=\"background:#f7f9fc;border:1px solid #e3e9f0;border-radius:8px;padding:20px 22px;margin:0 0 18px;font-size:14px;line-height:1.95;color:#3d4a5c;\">\n你是数据处理助手。<br/>\n我有一张表，列是：[日期][门店][品类][金额][数量]。<br/>\n请按顺序做这几件事：<br/>\n1. 把日期统一成 YYYY-MM-DD，无法识别的单独列出来<br/>\n2. 把金额转成纯数字，去掉千分位和单位<br/>\n3. 按门店、按品类分别汇总金额和数量<br/>\n4. 计算每个品类相对上月的环比<br/>\n5. 标出环比波动超过 30% 的品类<br/>\n6. 输出可直接粘贴进 Excel 的表格<br/>\n注意：缺失值标记为空，不要推测，不要补全。<br/>\n每一步做完先告诉我结果，等我确认再继续。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n最后那句\"等我确认再继续\"很重要。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 34px;line-height:1.9;\">\n让它一口气跑完，中间错了你根本看不出来；拆开一步步来，出错当场就能发现。\n</p>\n\n<p style=\"margin:46px 0 0;\"><span style=\"display:inline-block;background:#1a1a1a;color:#fff;font-size:15px;font-weight:bold;padding:6px 18px;border-radius:4px;\">说点实话</span></p>\n\n<p style=\"font-size:15px;color:#333;margin:18px 0 16px;line-height:1.9;\">\n40 分钟里，省下来的是原来那两天里约 6 小时的清洗和 3 小时的核对。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n真正的判断一点没少：哪些异常是真的、哪家店的数据有问题、这张表能不能拿去开会，还是得我自己盯。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n所以我不太认同\"AI 帮我做完了整张表\"这种说法。\n</p>\n\n<p style=\"font-size:17px;font-weight:bold;color:#1a1a1a;margin:0 0 16px;line-height:1.85;text-align:center;\">\n它替我做的是我不想做的那 70%。<br/>剩下的 30%，才是我的活。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 16px;line-height:1.9;\">\n下次我打算试试把它做成一个固定流程，每个月丢文件进去就出表。\n</p>\n\n<p style=\"font-size:15px;color:#333;margin:0 0 34px;line-height:1.9;\">\n如果跑通了，再写一篇。\n</p>\n\n<p style=\"background:#f0f6ff;border-radius:8px;padding:18px 20px;margin:0 0 24px;font-size:15px;line-height:1.9;color:#1a4a8a;\">\n<strong>关注后回复「模板」，</strong>拿这份提示词、清洗检查清单，还有一张我自己用的表结构示例。\n</p>\n\n<p style=\"font-size:13px;color:#aaa;margin:0 0 8px;line-height:1.7;text-align:center;\">\n文中为本人实测，数据源不同结果会有差异。\n</p>\n"
}

  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
