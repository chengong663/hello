<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello World - 欢迎来到我的网站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow-x: hidden;
  }
  .container {
    text-align: center;
    padding: 3rem 2rem;
    max-width: 720px;
    width: 90%;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    animation: fadeIn 1s ease-out;
  }
  .emoji {
    font-size: 4rem;
    display: block;
    margin-bottom: 1rem;
    animation: wave 2s ease-in-out infinite;
  }
  h1 {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
    letter-spacing: -0.5px;
  }
  p.subtitle {
    font-size: 1.125rem;
    opacity: 0.9;
    line-height: 1.6;
    margin-bottom: 2rem;
  }
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .feature {
    background: rgba(255, 255, 255, 0.15);
    padding: 1.25rem;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    transition: transform 0.3s ease, background 0.3s ease;
  }
  .feature:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.25);
  }
  .feature-icon {
    font-size: 2rem;
    display: block;
    margin-bottom: 0.5rem;
  }
  .feature-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  .feature-desc {
    font-size: 0.8rem;
    opacity: 0.85;
  }
  .cta {
    display: inline-block;
    padding: 0.85rem 2rem;
    background: #fff;
    color: #764ba2;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
    font-size: 1rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
  }
  .cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  }
  .footer {
    margin-top: 2rem;
    font-size: 0.85rem;
    opacity: 0.7;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(15deg); }
    75% { transform: rotate(-15deg); }
  }
  @media (max-width: 480px) {
    h1 { font-size: 1.875rem; }
    .container { padding: 2rem 1.25rem; }
  }
</style>
</head>
<body>
  <div class="container">
    <span class="emoji">👋</span>
    <h1>你好，世界！</h1>
    <p class="subtitle">
      欢迎来到我的第一个网站。这是一个使用 TRAE 一键部署的静态网页示例。
    </p>
    <div class="features">
      <div class="feature">
        <span class="feature-icon">⚡</span>
        <div class="feature-title">快速部署</div>
        <div class="feature-desc">一键上线，即刻访问</div>
      </div>
      <div class="feature">
        <span class="feature-icon">🎨</span>
        <div class="feature-title">精美设计</div>
        <div class="feature-desc">响应式现代 UI</div>
      </div>
      <div class="feature">
        <span class="feature-icon">🚀</span>
        <div class="feature-title">全球加速</div>
        <div class="feature-desc">稳定可靠的托管</div>
      </div>
    </div>
    <a href="#" class="cta">开始探索 →</a>
    <div class="footer">
      Powered by TRAE Deployment · 2026
    </div>
  </div>
</body>
</html>
